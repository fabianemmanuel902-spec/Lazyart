<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Camera Overlay</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #111;
      color: #fff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 12px 16px;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid #333;
      z-index: 10;
    }

    .header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button, label.btn {
      background: #2d6cdf;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    button:hover, label.btn:hover {
      background: #1f5bc4;
    }

    button:disabled {
      background: #444;
      cursor: not-allowed;
    }

    button.secondary {
      background: #333;
    }

    button.secondary:hover {
      background: #444;
    }

    input[type="file"] {
      display: none;
    }

    .viewer {
      flex: 1;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    #camera {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 80%;
      max-height: 80%;
      pointer-events: none;
      user-select: none;
      opacity: 0.7;
      transition: opacity 0.1s;
    }

    #overlay.draggable {
      pointer-events: auto;
      cursor: move;
    }

    .panel {
      padding: 14px 16px;
      background: #1a1a1a;
      border-top: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slider-row label {
      font-size: 0.9rem;
      min-width: 90px;
      color: #ccc;
    }

    input[type="range"] {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: #333;
      border-radius: 3px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #2d6cdf;
      cursor: pointer;
      border: 2px solid #fff;
    }

    input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #2d6cdf;
      cursor: pointer;
      border: 2px solid #fff;
    }

    .value {
      font-size: 0.9rem;
      min-width: 40px;
      text-align: right;
      color: #aaa;
    }

    .status {
      font-size: 0.8rem;
      color: #888;
      text-align: center;
    }

    .status.error {
      color: #e74c3c;
    }

    .hint {
      font-size: 0.75rem;
      color: #666;
      text-align: center;
    }

    /* Make overlay movable on touch/mouse */
    #overlay.draggable {
      touch-action: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📷 Camera Overlay</h1>
    <div class="controls">
      <button id="startBtn">Start Camera</button>
      <button id="stopBtn" class="secondary" disabled>Stop</button>
      <label class="btn" for="fileInput">Upload Image</label>
      <input type="file" id="fileInput" accept="image/*">
      <button id="clearBtn" class="secondary" disabled>Clear Overlay</button>
    </div>
  </div>

  <div class="viewer">
    <video id="camera" autoplay playsinline muted></video>
    <img id="overlay" alt="Overlay" style="display: none;">
  </div>

  <div class="panel">
    <div class="slider-row">
      <label for="opacity">Transparency</label>
      <input type="range" id="opacity" min="0" max="100" value="70">
      <span class="value" id="opacityValue">70%</span>
    </div>
    <div class="slider-row">
      <label for="scale">Size</label>
      <input type="range" id="scale" min="10" max="200" value="100">
      <span class="value" id="scaleValue">100%</span>
    </div>
    <p class="status" id="status">Click "Start Camera" to begin</p>
    <p class="hint">Tip: Drag the overlay image to reposition it</p>
  </div>

  <script>
    const video = document.getElementById('camera');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const clearBtn = document.getElementById('clearBtn');
    const fileInput = document.getElementById('fileInput');
    const opacitySlider = document.getElementById('opacity');
    const opacityValue = document.getElementById('opacityValue');
    const scaleSlider = document.getElementById('scale');
    const scaleValue = document.getElementById('scaleValue');
    const status = document.getElementById('status');

    let stream = null;
    let isDragging = false;
    let startX, startY, offsetX = 0, offsetY = 0;
    let currentScale = 1;

    // Start camera
    startBtn.addEventListener('click', async () => {
      try {
        status.textContent = 'Requesting camera access...';
        status.classList.remove('error');

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' }, // prefer back camera on mobile
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;
        startBtn.disabled = true;
        stopBtn.disabled = false;
        status.textContent = 'Camera active';
      } catch (err) {
        console.error(err);
        status.textContent = 'Camera access denied or unavailable. Use HTTPS or localhost.';
        status.classList.add('error');
      }
    });

    // Stop camera
    stopBtn.addEventListener('click', () => {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
        video.srcObject = null;
      }
      startBtn.disabled = false;
      stopBtn.disabled = true;
      status.textContent = 'Camera stopped';
    });

    // Upload image
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        overlay.src = event.target.result;
        overlay.style.display = 'block';
        overlay.classList.add('draggable');
        clearBtn.disabled = false;
        // Reset position
        offsetX = 0;
        offsetY = 0;
        overlay.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px)) scale(${currentScale})`;
        status.textContent = 'Image loaded – adjust transparency & size below';
      };
      reader.readAsDataURL(file);
    });

    // Clear overlay
    clearBtn.addEventListener('click', () => {
      overlay.src = '';
      overlay.style.display = 'none';
      overlay.classList.remove('draggable');
      clearBtn.disabled = true;
      fileInput.value = '';
      status.textContent = 'Overlay cleared';
    });

    // Opacity control
    opacitySlider.addEventListener('input', () => {
      const val = opacitySlider.value;
      overlay.style.opacity = val / 100;
      opacityValue.textContent = val + '%';
    });

    // Scale control
    scaleSlider.addEventListener('input', () => {
      currentScale = scaleSlider.value / 100;
      scaleValue.textContent = scaleSlider.value + '%';
      overlay.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px)) scale(${currentScale})`;
    });

    // Drag to reposition overlay
    function startDrag(e) {
      if (!overlay.classList.contains('draggable')) return;
      isDragging = true;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      startX = clientX - offsetX;
      startY = clientY - offsetY;
      e.preventDefault();
    }

    function onDrag(e) {
      if (!isDragging) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      offsetX = clientX - startX;
      offsetY = clientY - startY;
      overlay.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px)) scale(${currentScale})`;
    }

    function endDrag() {
      isDragging = false;
    }

    overlay.addEventListener('mousedown', startDrag);
    overlay.addEventListener('touchstart', startDrag, { passive: false });
    window.addEventListener('mousemove', onDrag);
    window.addEventListener('touchmove', onDrag, { passive: false });
    window.addEventListener('mouseup', endDrag);
    window.addEventListener('touchend', endDrag);

    // Set initial opacity
    overlay.style.opacity = 0.7;
  </script>
</body>
</html>
